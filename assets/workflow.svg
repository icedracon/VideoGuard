<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">VideoGuard production pipeline</title><desc id="desc">Brief, detective interview, model-specific compiler, preflight, approval, external generation, output review and targeted retry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8da7c5"/></marker></defs><rect width="960" height="360" rx="18" fill="#101827"/><g font-family="sans-serif" fill="#f1f5f9"><text x="30" y="40" font-size="24" font-weight="bold">VIDEOGUARD / PRODUCTION PIPELINE</text><text x="30" y="65" font-size="14" fill="#a8b9ce">Independent advisory preflight · image and video</text></g><g fill="#1c2a40" stroke="#57708e"><rect x="30" y="95" width="195" height="82" rx="10"/><rect x="265" y="95" width="195" height="82" rx="10"/><rect x="500" y="95" width="195" height="82" rx="10"/><rect x="735" y="95" width="195" height="82" rx="10"/><rect x="30" y="220" width="195" height="82" rx="10"/><rect x="265" y="220" width="195" height="82" rx="10"/><rect x="500" y="220" width="195" height="82" rx="10"/><rect x="735" y="220" width="195" height="82" rx="10"/></g><g font-family="sans-serif" fill="#f1f5f9" font-size="16"><text x="45" y="123" font-weight="bold">01 / Brief</text><text x="45" y="149" font-size="12" fill="#b8c9dd">Goal and constraints</text><text x="280" y="123" font-weight="bold">02 / Detective</text><text x="280" y="149" font-size="12" fill="#b8c9dd">Adaptive interview</text><text x="515" y="123" font-weight="bold">03 / Compile</text><text x="515" y="149" font-size="12" fill="#b8c9dd">Model-specific prompt</text><text x="750" y="123" font-weight="bold">04 / Preflight</text><text x="750" y="149" font-size="12" fill="#b8c9dd">Lint and compatibility</text><text x="45" y="248" font-weight="bold">08 / Review</text><text x="45" y="274" font-size="12" fill="#b8c9dd">Evidence and retry</text><text x="280" y="248" font-weight="bold">07 / Generate</text><text x="280" y="274" font-size="12" fill="#b8c9dd">External provider</text><text x="515" y="248" font-weight="bold">06 / Approve</text><text x="515" y="274" font-size="12" fill="#b8c9dd">Explicit user gate</text><text x="750" y="248" font-weight="bold">05 / Budget</text><text x="750" y="274" font-size="12" fill="#b8c9dd">Quote and retry cap</text></g><g stroke="#8da7c5" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M225 136H262"/><path d="M460 136H497"/><path d="M695 136H732"/><path d="M832 177V216"/><path d="M735 261H698"/><path d="M500 261H463"/><path d="M265 261H228"/></g><text x="30" y="332" font-size="13" fill="#fbbf24" font-family="sans-serif">If review fails: isolate the affected dependency, revise, and obtain fresh approval.</text></svg>