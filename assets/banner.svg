<text x="67" y="168" font-family="system-ui,Arial,sans-serif" font-size="78" font-weight="750" letter-spacing="-3" fill="#f3f8ff">Video<tspan fill="#6cf4d6">Guard</tspan></text>
<text x="72" y="215" fill="#c0d1e1" font-family="system-ui,Arial,sans-serif" font-size="27">AI image &amp; video preflight engine</text>
<text x="72" y="255" fill="#91a9bc" font-family="system-ui,Arial,sans-serif" font-size="18">Think before you generate. Protect your creative intent and budget.</text>
