<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
<title id="title">VideoGuard — AI Image and Video Preflight</title>
<desc id="desc">Dark cinematic banner with a shield and play icon, and a five-step workflow: interview, compile, validate, budget, approve.</desc>
<defs>
