 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9bb4c9" stroke-opacity=".075"/></pattern>
 <radialGradient id="glow"><stop stop-color="#2577a6" stop-opacity=".38"/><stop offset="1" stop-color="#2577a6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="410" rx="22" fill="url(#bg)"/>
